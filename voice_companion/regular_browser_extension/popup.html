<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Voice Companion browser connection</title></head>
<body><h1>Voice Companion browser connection</h1>
<p>Connect the tab you have open. Then return to Voice Companion and choose Regular browser connection. You may close this popup.</p>
<button id="connect">Connect this tab</button>
<button id="read">Read page</button>
<button id="previous">Previous control</button>
<button id="next">Next control</button>
<button id="activate">Activate control</button>
<button id="space">Select radio button or checkbox</button>
<button id="disconnect">Disconnect</button>
<p id="status" role="status" aria-live="polite">Choose Connect this tab to begin.</p>
<script src="popup.js"></script></body></html>
