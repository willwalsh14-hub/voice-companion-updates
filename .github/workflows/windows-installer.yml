name: Build and publish Windows installer
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'voice_companion/**'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [main]
    paths:
      - 'voice_companion/**'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: write
concurrency:
  group: voice-companion-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check experimental regular-browser message handling
        run: node ./voice_companion/regular_browser_extension/test-worker.cjs
      - name: Install installer compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Restore distributor Gmail registration
        shell: pwsh
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if (-not $env:GOOGLE_CLIENT_JSON) { throw 'Add the distributor Desktop OAuth registration as the GOOGLE_CLIENT_JSON repository secret before building.' }
          $registration = $env:GOOGLE_CLIENT_JSON | ConvertFrom-Json
          if (-not $registration.installed.client_id -or -not $registration.installed.client_secret) { throw 'The Gmail Desktop OAuth registration is invalid.' }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'voice_companion/google-client.json'), $env:GOOGLE_CLIENT_JSON)
      - name: Restore pinned eSpeak runtime and corresponding source
        shell: pwsh
        run: |
          python ./voice_companion/prepare_espeak.py ./voice_companion/espeak
          if ($LASTEXITCODE -ne 0) { throw 'eSpeak preparation failed.' }
          $source = './voice_companion/espeak/espeak-ng-1.52.0-source.tar.gz'
          Invoke-WebRequest 'https://github.com/willwalsh14-hub/voice-companion-updates/releases/download/v0.2.77-test/espeak-ng-1.52.0-source.tar.gz' -OutFile $source
          if ((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23') { throw 'The eSpeak source checksum differs from the verified source.' }
          if (-not (Test-Path './voice_companion/espeak/COPYING')) { throw 'The eSpeak distribution license is missing.' }
      - name: Build and test complete installer
        shell: powershell
        run: |
          $env:VOICE_COMPANION_BUILD_PYTHON = (Get-Command python.exe).Source
          # Hosted runners already include Chrome. Reuse it rather than
          # downloading a moving installer through a stale package checksum.
          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          if (-not ($chromeCandidates | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install googlechrome --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Verified Chrome installation for browser checks failed.' }
          }
          $braveCandidates = @(
            "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe",
            "${env:ProgramFiles(x86)}\BraveSoftware\Brave-Browser\Application\brave.exe",
            "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe"
          )
          if (-not ($braveCandidates | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install brave --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Verified Brave installation for browser checks failed.' }
          }
          $env:VOICE_COMPANION_REQUIRE_BROWSER_CHANNELS = '1'
          & ./voice_companion/build-windows.ps1 -Parakeet -NoPublish -Unattended
      - name: Preserve checked installer before publishing
        uses: actions/upload-artifact@v6
        with:
          name: checked-windows-installer
          path: |
            voice_companion/VoiceCompanion-Setup.exe
            voice_companion/VoiceCompanion-Build-Passed.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Audit public websites and live radio and podcast streams
        shell: pwsh
        run: |
          $python = Join-Path $env:LOCALAPPDATA 'VCBuild\py312\Scripts\python.exe'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD 'voice_companion/browser-runtime'
          & $python -u ./voice_companion/consumer_site_audit.py --output ./voice_companion/VoiceCompanion-Consumer-Site-Audit.txt
          if ($LASTEXITCODE -ne 0) { throw 'A loaded public website failed its consumer navigation checks. Read the site audit report.' }
      - name: Audit synthesized speech recognition and command routing
        shell: pwsh
        run: |
          $python = Join-Path $env:LOCALAPPDATA 'VCBuild\py312\Scripts\python.exe'
          & $python -u ./voice_companion/consumer_voice_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'A recognized synthetic speech command failed its routing check. Read the voice audit report.' }
      - name: Publish verified installer and update feed
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          & python -u ./voice_companion/publish_release.py --setup ./voice_companion/VoiceCompanion-Setup.exe --gh gh
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed. Read the progress log.' }
      - name: Save build and publishing logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: installer-build-logs
          path: |
            voice_companion/VoiceCompanion-*.txt
            voice_companion/VoiceCompanion-Build-Passed.json
            voice_companion/VoiceCompanion-Published.json
            voice_companion/security-dependency-audit.json
          retention-days: 7
          if-no-files-found: warn
