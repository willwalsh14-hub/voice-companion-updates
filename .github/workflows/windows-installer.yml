name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audio checks in a venv, under load, eight times (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          python -m venv $env:RUNNER_TEMP\vc
          $py = Join-Path $env:RUNNER_TEMP 'vc\Scripts\python.exe'
          & $py -m pip install --disable-pip-version-check -r requirements.txt
          & $py -m playwright install firefox
          # CPU load like the build: two busy processes
          $load = 1..2 | ForEach-Object { Start-Process -PassThru -WindowStyle Hidden $py -ArgumentList '-c','while True: sum(range(100000))' }
          foreach ($n in 1..8) {
            $ErrorActionPreference = 'Continue'
            $out = (& $py -m unittest test_consumer_audio test_radio_stream_live 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $fails = (($out | Where-Object { $_ -match '^(FAIL|ERROR):|Error:|skipped' } | Select-Object -First 8) -join '%0A').Replace('::',': ')
            Write-Output ('::error title=Audio run ' + $n + '::' + $(if ($code -eq 0) { 'PASS%0A' } else { 'FAIL%0A' }) + $fails)
          }
          $load | Stop-Process -Force
          throw 'Diagnostic finished. See the annotations.'
