name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: YouTube data diagnostics (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -u diag_youtube.py
          throw 'Diagnostic finished. See the annotations.'
