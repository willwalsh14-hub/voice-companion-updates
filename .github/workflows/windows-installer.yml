name: Build and publish Windows installer
# TRY BRANCH ONLY (claude/try-tb-marks): runs the real-Thunderbird marks check instead of the
# build. Never merged.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: try-tb-marks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Real Thunderbird marks check
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'tbmarks'
          python ./voice_companion/check_thunderbird_marks_live.py $work 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'out.txt')
          $code = $LASTEXITCODE
          $reportPath = Join-Path $work 'report.json'
          if (Test-Path $reportPath) {
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            $failed = @($report.checks.PSObject.Properties | Where-Object { -not $_.Value } | ForEach-Object { $_.Name })
            Write-Output ('::error title=Failed checks::' + ($failed -join ', '))
            $text = (Get-Content $reportPath -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            for ($i = 0; $i -lt [Math]::Min(9, [Math]::Ceiling($text.Length / 3800)); $i++) {
              $piece = $text.Substring($i * 3800, [Math]::Min(3800, $text.Length - $i * 3800))
              Write-Output ('::warning title=Report part ' + ($i + 1) + '::' + $piece)
            }
          } else {
            $tail = (Get-Content (Join-Path $env:RUNNER_TEMP 'out.txt') -Raw)
            if ($tail.Length -gt 3500) { $tail = $tail.Substring($tail.Length - 3500) }
            Write-Output ('::error title=No report::' + ($tail -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
          }
          exit $code
