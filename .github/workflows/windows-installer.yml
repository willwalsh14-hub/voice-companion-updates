name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: YouTube checks on Windows (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install chromium
          python build_webview2.py
          if ($LASTEXITCODE -ne 0) { Write-Output '::error title=WebView2 host::The embedded Edge host could not be built.'; throw 'host' }
          $env:VOICE_COMPANION_REQUIRE_WEBVIEW2 = '1'
          $env:VOICE_COMPANION_REQUIRE_WEB_TESTS = '1'
          $bad = 0
          foreach ($t in @('test_youtube', 'test_youtube_live', 'test_youtube_webview2',
                           'test_youtube_window.YouTubeWindowKeyTests.test_action_keys_reach_the_screen_and_are_never_typed',
                           'test_youtube_window.YouTubeWindowKeyTests.test_a_question_takes_y_n_and_arrows')) {
            $ErrorActionPreference = 'Continue'
            $out = (& python -m unittest -v $t 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $lines = @($out | Where-Object { $_ -match '^(FAIL|ERROR):|Error|Exception|^Ran |^OK|FAILED|skipped' } | Select-Object -First 30)
            $text = (($lines -join '%0A').Replace('::', ': '))
            if ($text.Length -gt 3500) { $text = $text.Substring(0, 3500) }
            Write-Output ('::error title=' + $t + '::' + $(if ($code -eq 0) { 'PASS%0A' } else { 'FAIL%0A' }) + $text)
            if ($code -ne 0) { $bad += 1 }
          }
          if ($bad) { throw ('' + $bad + ' YouTube check groups failed. See the annotations.') }
