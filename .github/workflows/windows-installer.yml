name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install packages
        shell: pwsh
        working-directory: voice_companion
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Hidden windows checks (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          function Report($name, $arguments) {
            $ErrorActionPreference = 'Continue'
            $out = (& python -m unittest -v @arguments 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            Write-Output $out
            $lines = ($out | Where-Object { $_ -match '(FAIL|ERROR|skipped|TASKBAR|REAL|Error|assert|\.\.\. ok|Ran )' } | Select-Object -First 40)
            $text = ($lines -join '%0A').Replace('::', ': ')
            if ($text.Length -gt 3800) { $text = $text.Substring(0, 3800) }
            Write-Output ('::error title=' + $name + '::' + $(if ($code -eq 0) { 'PASS%0A' } else { 'FAIL%0A' }) + $text)
          }
          Report 'Unit checks' @('test_window_hiding', 'test_browser_window')
          Report 'Stand-in run 1' @('test_window_hiding_windows.StandInThunderbirdTests')
          Report 'Stand-in run 2' @('test_window_hiding_windows.StandInThunderbirdTests')
          Report 'Headless Chrome run 1' @('test_browser_window_live')
          Report 'Headless Chrome run 2' @('test_browser_window_live')
          $audio = (Get-Service Audiosrv -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Status)
          $devices = (Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Output ('::error title=Sound on this runner::Audiosrv=' + $audio + ' sound devices=' + $devices)
      - name: Real Thunderbird check (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          $ErrorActionPreference = 'Continue'
          choco install thunderbird --yes --no-progress | Select-Object -Last 3
          $exe = @("$env:ProgramFiles\Mozilla Thunderbird\thunderbird.exe", "${env:ProgramFiles(x86)}\Mozilla Thunderbird\thunderbird.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { Write-Output '::error title=Real Thunderbird::Thunderbird did not install'; exit 0 }
          $env:VOICE_COMPANION_REAL_THUNDERBIRD = $exe
          $out = (& python -m unittest -v test_window_hiding_windows.RealThunderbirdTests 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          Write-Output $out
          $text = (($out | Where-Object { $_ -match '(FAIL|ERROR|skipped|REAL|Error|assert|\.\.\. ok|Ran )' } | Select-Object -First 40) -join '%0A').Replace('::', ': ')
          if ($text.Length -gt 3800) { $text = $text.Substring(0, 3800) }
          Write-Output ('::error title=Real Thunderbird::' + $(if ($code -eq 0) { 'PASS%0A' } else { 'FAIL%0A' }) + $text)
