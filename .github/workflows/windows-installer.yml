name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install packages
        shell: pwsh
        working-directory: voice_companion
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Large heading window checks (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          $failed = 0
          function Report($name, $arguments) {
            $ErrorActionPreference = 'Continue'
            $out = (& python -m unittest -v @arguments 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            Write-Output $out
            $lines = ($out | Where-Object { $_ -match '(FAIL|ERROR|skipped|Error|assert|\.\.\. ok|Ran )' } | Select-Object -First 40)
            $text = ($lines -join '%0A').Replace('::', ': ')
            if ($text.Length -gt 3800) { $text = $text.Substring(0, 3800) }
            Write-Output ('::error title=' + $name + '::' + $(if ($code -eq 0) { 'PASS%0A' } else { 'FAIL%0A' }) + $text)
            if ($code -ne 0) { $script:failed = 1 }
          }
          Report 'Large heading run 1' @('test_large_heading_window.LargeHeadingWindowTests')
          Report 'Large heading run 2' @('test_large_heading_window.LargeHeadingWindowTests')
          Report 'Existing window keys after the change' @('test_youtube_window.YouTubeWindowKeyTests')
          Report 'Header keys after the change' @('test_header_keys_window.HeaderKeyWindowTests')
          exit $failed
