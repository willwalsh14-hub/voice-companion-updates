name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Heading arrows window test (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          $results = @()
          foreach ($t in @('test_keyboard_text.WindowKeyboardTests','test_native_settings','test_options_dialog_windows')) {
            $ErrorActionPreference = 'Continue'
            $out = (& python -m unittest -v $t 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $fails = ($out | Where-Object { $_ -match '^(FAIL|ERROR):|^AssertionError|Error:' } | Select-Object -First 12) -join '%0A'
            $line = $t + ': ' + $(if ($code -eq 0) { 'PASS' } else { 'FAIL%0A' + $fails })
            Write-Output ('::error title=Window test ' + $t + '::' + $line)
          }
          throw 'Diagnostic finished. See the annotations.'
