name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audio player checks, five times (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install firefox
          foreach ($n in 1..5) {
            $ErrorActionPreference = 'Continue'
            $out = (& python -m unittest -v test_consumer_audio 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $fails = ((($out | Where-Object { $_ -match '^(FAIL|ERROR):|Error|skipped' } | Select-Object -First 12)) -join '%0A').Replace('::',': ')
            Write-Output ('::error title=Audio run ' + $n + '::' + $(if ($code -eq 0) { 'PASS%0A' } else { 'FAIL%0A' }) + $fails)
          }
          throw 'Diagnostic finished. See the annotations.'
