name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Podcast player checks, the way the build runs them (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          # The build's own way: a virtual environment, Firefox in browser-runtime.
          $venv = Join-Path $env:LOCALAPPDATA 'VCBuild\py312'
          python -m venv $venv
          $py = Join-Path $venv 'Scripts\python.exe'
          & $py -m pip install --disable-pip-version-check -r requirements.txt
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD 'browser-runtime'
          & $py -m playwright install firefox
          $env:VOICE_COMPANION_REQUIRE_WEB_TESTS = '1'
          $ErrorActionPreference = 'Continue'
          $runs = @(@('test_media_player_window'), @('test_consumer_audio','test_radio_stream_live','test_media_player_window'),
                    @('test_podcast_player','test_podcast_browsing','test_media_hub','test_audio_ducking','test_media_new_veteran','test_browser_media_polish'))
          foreach ($n in 1..3) {
            foreach ($run in $runs) {
              $out = (& $py -m unittest -v @run 2>&1 | ForEach-Object { "$_" })
              $code = $LASTEXITCODE
              $notes = ((($out | Where-Object { $_ -match '^(FAIL|ERROR):|Error|SOUND SESSION|skipped' } | Select-Object -First 14) + @('--- last ---') + ($out | Select-Object -Last 6)) -join '%0A').Replace('::',': ')
              Write-Output ('::error title=Run ' + $n + ' ' + ($run -join ' ') + '::' + $(if ($code -eq 0) { 'PASS%0A' } else { 'FAIL%0A' }) + $notes)
            }
          }
          # Apple's real charts, from a real computer.
          $live = (& $py ../.github/try_apple_charts.py 2>&1 | ForEach-Object { "$_" }) -join '%0A'
          Write-Output ('::error title=Apple charts live::' + $live.Replace('::',': '))
          throw 'Diagnostic finished. See the annotations.'
