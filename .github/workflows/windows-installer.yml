name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 0.2.173 window tests (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          foreach ($t in @('test_header_keys_window','test_now_playing_window','test_save_as_window','test_keyboard_text.WindowKeyboardTests','test_alt_keys_window.AltKeyWindowTests','test_input_parity.WindowScreenKeyTests','test_time_date_windows.WindowClockKeyTests')) {
            $ErrorActionPreference = 'Continue'
            $out = (& python -m unittest -v $t 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $fails = ((($out | Where-Object { $_ -match '^(FAIL|ERROR):|Error' } | Select-Object -First 10) + @('--- last ---') + ($out | Select-Object -Last 8)) -join '%0A').Replace('::',': ')
            Write-Output ('::error title=Window test ' + $t + '::' + $t + ': ' + $(if ($code -eq 0) { 'PASS' } else { 'FAIL%0A' + $fails }))
          }
          throw 'Diagnostic finished. See the annotations.'
