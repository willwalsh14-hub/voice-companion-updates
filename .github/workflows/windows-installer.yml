name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contact dialog diagnostic (try branch only)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r voice_companion/requirements.txt
          git worktree add main-copy origin/main
          python tools/diag_contact.py main-copy/voice_companion main
          python tools/diag_contact.py voice_companion release
          throw 'Diagnostic finished. See the annotations.'
