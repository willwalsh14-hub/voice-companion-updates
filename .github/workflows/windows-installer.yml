name: Build and publish Windows installer
on:
  pull_request:
    branches: [main]
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Background window tests (try branch only)
        shell: pwsh
        working-directory: voice_companion
        run: |
          python -m venv $env:RUNNER_TEMP\venv
          $py = "$env:RUNNER_TEMP\venv\Scripts\python.exe"
          & $py -m pip install --disable-pip-version-check -q -r requirements.txt
          foreach ($round in 1..3) {
            foreach ($t in @('test_chrome_window','test_thunderbird_host_reconnect','test_browser_window','test_browser_window_live','test_window_hiding_windows')) {
              $ErrorActionPreference = 'Continue'
              $out = (& $py -m unittest -v $t 2>&1 | ForEach-Object { "$_" })
              $code = $LASTEXITCODE
              $fails = ($out | Where-Object { $_ -match '^(FAIL|ERROR):|AssertionError|Error:|skipped' } | Select-Object -First 14) -join '%0A'
              $line = $t + ': ' + $(if ($code -eq 0) { 'PASS ' + ($out | Where-Object { $_ -match '^(Ran|OK)' }) -join ' ' } else { 'FAIL%0A' + $fails })
              Write-Output ('::error title=Round ' + $round + ' ' + $t + '::' + $line)
            }
          }
          & $py diag_google.py
          throw 'Diagnostic finished. See the annotations.'
