name: Try media window key tests
# A try run for new Windows-only media window key tests (CLAUDE.md: tried before they join a release).
# Runs them the way build-windows.ps1 does: a venv made from Python 3.12 with the
# app's requirements, the WebView2 host built, and each real-window class in its own process.
on:
  push:
    branches: ['claude/try-media-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare the build Python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $buildEnv = Join-Path $env:LOCALAPPDATA 'VCBuild\py312'
          & (Get-Command python.exe).Source -m venv $buildEnv
          $python = Join-Path $buildEnv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --upgrade 'pip==26.2.1'
          & $python -m pip install --disable-pip-version-check -r voice_companion/requirements.txt
          if ($LASTEXITCODE -ne 0) { Write-Output '::error title=Try setup::pip install failed'; exit 1 }
          Set-Location voice_companion
          & $python build_webview2.py 2>&1 | Out-String | Tee-Object -Variable built | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Output ('::error title=WebView2 host build failed::' + (($built -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))); exit 1 }
          & $python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { Write-Output '::error title=Try setup::Chromium install failed'; exit 1 }
      - name: Run the media window tests
        shell: powershell
        working-directory: voice_companion
        run: |
          $python = Join-Path $env:LOCALAPPDATA 'VCBuild\py312\Scripts\python.exe'
          $failed = 0
          function Run-Tests([string]$Title, [string[]]$Arguments) {
            $log = Join-Path $PWD ('try-' + ($Title -replace '[^A-Za-z0-9]','') + '.txt')
            $previous = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
            & $python -m unittest @Arguments 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log | Out-Host
            $code = $LASTEXITCODE; $ErrorActionPreference = $previous
            if ($code -ne 0) {
              $text = Get-Content -LiteralPath $log -Raw
              $start = $text.IndexOf('======')
              $body = $(if ($start -ge 0) { $text.Substring($start) } else { $text })
              $clean = $body -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
              if ($clean.Length -gt 3500) { $clean = $clean.Substring(0, 1200) + '%0A...%0A' + $clean.Substring($clean.Length - 2300) }
              Write-Output ('::error title=' + $Title + ' failed::' + $clean) | Out-Host
              $failedTests = @(Select-String -LiteralPath $log -Pattern '^(FAIL|ERROR): ' | ForEach-Object { $_.Line }) -join '%0A'
              Write-Output ('::error title=' + $Title + ' failed tests::' + $failedTests) | Out-Host
            }
            return $code
          }
          foreach ($run in 1..3) {
            foreach ($class in @('test_youtube_window.YouTubeWindowKeyTests','test_media_window_keys.MediaWindowKeyTests')) {
              if ((Run-Tests ("Window $class run $run") @('-v', $class)) -ne 0) { $failed += 1 }
            }
          }
          if ((Run-Tests 'Media key routing' @('-v','test_media_expert_user','test_input_parity','test_screen_menus')) -ne 0) { $failed += 1 }
          if ($failed) { exit 1 }
