name: Try - update probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/try/**', '.github/workflows/try-update-probe.yml', 'voice_companion/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set Will's time zone
        run: tzutil /s "Eastern Standard Time"
      - name: Time each part of the shipped close step
        shell: powershell
        run: |
          $out = & .\.github\try\close-timing.ps1 2>&1 | Out-String
          Write-Output $out
          $clean = $out -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
          for ($i = 0; $i -lt [Math]::Min(8, [Math]::Ceiling($clean.Length / 3500)); $i++) {
            Write-Output ('::warning title=Timing part ' + ($i + 1) + '::' + $clean.Substring($i * 3500, [Math]::Min(3500, $clean.Length - $i * 3500)))
          }
